<script type="text/javascript">
var player;

function getPlayer() {
	return document.getElementById("RAOCX");
  if (document.prim_player_embed) {
    return document.prim_player_embed;
  } else {
    return document.prim_player;
  }
}

function Player() {
    this.player     = getPlayer();
    this.stop       = playerStop;
    this.play       = playerPlay;
    this.pause      = playerPause;
}

function playerStop() {
  this.player.DoStop();
}

function playerPause() {
  this.player.DoPause();
}

function playerPlay() {
  this.player.DoPlay();
}

function pageLoad() {
  player = new Player(); 
}
</script>
